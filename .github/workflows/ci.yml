name: ci

# Actions minutes are free on a public repo, so this costs nothing.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  reply-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate self-test
        run: python3 .claude/hooks/reply_gate.py --self-test
      - name: Manifests are valid JSON and register the hook
        run: |
          python3 - <<'PY'
          import json
          h = json.load(open(".claude/hooks/hooks.json"))
          cmds = [x["command"] for g in h["hooks"]["Stop"] for x in g["hooks"]]
          assert any("reply_gate.py" in c for c in cmds), "Stop hook not registered"
          json.load(open(".claude/.claude-plugin/plugin.json"))
          json.load(open(".claude-plugin/marketplace.json"))
          print("manifests ok; Stop hook registered")
          PY
