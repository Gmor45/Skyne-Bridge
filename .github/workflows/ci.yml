name: ci

# Actions minutes are free on a public repo, so this costs nothing.
# pull_request ONLY. This repo now SHIPS the gate that refuses a check
# firing on both (repo_standard_gate.py, rule pr-not-push), so it had
# better obey it: a change checked on its PR and again on the merge is
# billed twice for one answer, and every job rounds up to a whole minute.
# Found by check_estate_hygiene.py on 2026-09-11, in this very file.
on:
  pull_request:

# repo-standard rule `cancel-superseded-runs`, 2026-09-15. A pull_request
# workflow reruns on EVERY push to that PR; without this the earlier run
# finishes and is billed in full for checking a commit that was already
# replaced. Measured in Skyne the same day: 15 runs on ONE branch, 13 on
# another. Minutes are free here -- this is carried so the estate-wide
# gate starts with no backlog to fire on.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo. Without this block a
# workflow gets whatever the repository hands out by default, which can
# include write access it never uses. repo-standard rule
# 'least-privilege-permissions', from OpenSSF Scorecard's Token-Permissions
# probe -- the first external check ever run against this estate.
permissions:
  contents: read

jobs:
  reply-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Gate self-test
        run: python3 .claude/hooks/reply_gate.py --self-test
      - name: Turn counter self-test
        run: python3 .claude/hooks/turn_counter.py --self-test
      - name: Delegate reminder self-test
        run: python3 .claude/hooks/delegate_reminder.py --self-test
      - name: Session-length stop self-test
        run: python3 .claude/hooks/session_length_stop.py --self-test
      - name: Push-to-main blocker self-test
        run: python3 .claude/hooks/no_push_to_main.py --self-test
      - name: Shell-shapes warner self-test
        run: python3 .claude/hooks/shell_shapes.py --self-test
      - name: Date-claims checker self-test (house-rules 40, incl. corpus sync)
        run: python3 .claude/hooks/date_claims.py --self-test
      - name: Pre-compaction snapshot self-test
        run: python3 .claude/hooks/precompact_snapshot.py --self-test
      - name: Routine repo/connector gate self-test
        run: python3 .claude/hooks/routine_sources_gate.py --self-test
      - name: Mechanism-gap gate self-test
        run: python3 .claude/hooks/mechanism_gap_gate.py --self-test
      - name: The repo-standard gate can still refuse
        run: python3 .claude/hooks/repo_standard_gate.py --self-test
      - name: Design-source gate self-test (house-rules 38)
        run: python3 .claude/hooks/design_source_gate.py --self-test
      - name: Guardrail gate self-test (the hard switches)
        run: python3 .claude/hooks/guardrail_gate.py --self-test
      - name: The guardrail gate is REGISTERED, on both events
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('.claude/hooks/hooks.json'))
          want = 'guardrail_gate.py'
          stop = any(want in h.get('command', '')
                     for g in d['hooks'].get('Stop', []) for h in g.get('hooks', []))
          bash = any(want in h.get('command', '')
                     for g in d['hooks'].get('PreToolUse', []) if g.get('matcher') == 'Bash'
                     for h in g.get('hooks', []))
          # A self-test proves the logic; this proves the logic is WIRED.
          # house-rules 21 step 4: registration and firing are different
          # claims, and a hook nobody registered passes its own tests forever.
          if not stop or not bash:
              print('guardrail_gate is NOT registered — Stop:%s Bash:%s' % (stop, bash))
              sys.exit(1)
          print('guardrail_gate registered on Stop and on PreToolUse/Bash')
          PY
